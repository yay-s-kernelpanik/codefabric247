name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tests:
    name: Release gate · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: Fabrica247
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile sources
        run: python -m compileall -q fabrica tests build_release.py
      - name: Run tests
        run: python -m unittest discover -s tests -v

  packages:
    name: Package · ${{ matrix.edition }}
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [windows-lite, windows-heavy, linux-lite, linux-heavy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build edition ZIP
        working-directory: Fabrica247
        run: python build_release.py --edition "${{ matrix.edition }}" --version "${GITHUB_REF_NAME#v}"
      - name: Upload edition package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.edition }}
          path: Fabrica247/dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all edition packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: sha256sum *.zip > SHA256SUMS.txt
      - name: Create GitHub Release and upload ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Descargas por edición

          Elegí el ZIP que coincide con tu sistema operativo y tipo de Worker:

          - Windows Lite: proveedor online, sin modelo local.
          - Windows Heavy: proveedor Ollama local.
          - Linux Lite: proveedor online, sin modelo local.
          - Linux Heavy: proveedor Ollama local.

          Cada ZIP incluye el núcleo común, documentación, instalador y perfil de esa edición. Consultá EDITION.txt dentro del archivo. Los hashes SHA-256 están en SHA256SUMS.txt.

          Los paquetes no incluyen Python, Git, OpenCode ni Ollama: esos requisitos se instalan por separado.
          EOF
          gh release create "$TAG" release-assets/* --title "Fabrica247 $TAG" --notes-file release-notes.md --verify-tag
